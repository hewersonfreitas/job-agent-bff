[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent-bff"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.143.3", "uvicorn==0.54.0", "httpx==0.28.1", "pydantic==2.14.1", "argon2-cffi==25.1.0", "jsonschema==4.25.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1", "cryptography>=45,<47"]

[tool.setuptools.packages.find]
include = ["bff*", "contracts*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603"]
"scripts/*" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
contracts = ["*.json", "*.sha256"]
