# Include inside the existing HTTPS server block. Keep /api public rules below.
location ^~ /workspace/ {
    client_max_body_size 5m;
    proxy_pass http://bff:8081;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_read_timeout 130s;
    proxy_send_timeout 35s;
    proxy_buffering off;
    proxy_cache off;
    access_log off;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
}
# Replace the former generic /api location with an explicit public read allowlist.
# All other /api routes (including private/admin paths and encoded variants) are denied.
location ~ ^/api/(health|statistics|openapi\.json|jobs|jobs/search|jobs/filter-options|jobs/[1-9][0-9]*|jobs/[1-9][0-9]*/events|social/statistics|social/posts|social/posts/[1-9][0-9]*)$ {
    limit_except GET { deny all; }
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:8765;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
location /api/ { return 403; }
